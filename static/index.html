<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="/style.css">

    <!-- Apply the saved or system theme before the page draws, to avoid a flash -->
    <script>
        (function () {
            let theme = null;

            try {
                theme = localStorage.getItem("theme");
            } catch (error) {
                // Storage can be blocked; fall back to the system setting
            }

            if (theme !== "light" && theme !== "dark") {
                theme = window.matchMedia("(prefers-color-scheme: dark)").matches
                    ? "dark"
                    : "light";
            }

            document.documentElement.dataset.theme = theme;
        })();
    </script>
</head>

<body>

    <div class="container">

        <header>
            <button
                type="button"
                id="theme-toggle"
                class="theme-toggle"
                aria-label="Switch to dark mode"
            >
                Dark Mode
            </button>

            <h1>Student Management System</h1>
            <p>Manage your student records easily.</p>
        </header>

        <!-- Dashboard Heading -->
        <section class="dashboard-heading">
            <h2>Student Dashboard</h2>
            <p>Add, edit, and review student records in one place.</p>

            <!-- Dashboard Statistics -->
            <div class="stats">

                <div class="stat-card">
                    <span class="stat-value" id="stat-total">0</span>
                    <span class="stat-label">Total Students</span>
                </div>

                <div class="stat-card">
                    <span class="stat-value" id="stat-departments">0</span>
                    <span class="stat-label">Departments</span>
                </div>

                <div class="stat-card">
                    <span class="stat-value" id="stat-largest">-</span>
                    <span class="stat-label" id="stat-largest-label">Largest Department</span>
                </div>

            </div>
        </section>

        <!-- Student Form -->
        <section class="form-section">

            <h2 id="form-title">Add New Student</h2>

            <form id="student-form">

                <input
                    type="text"
                    id="name"
                    placeholder="Student Name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="text"
                    id="department"
                    placeholder="Department"
                    required
                >

                <div class="button-group">

                    <button type="submit" id="submit-button">
                        Add Student
                    </button>

                    <button
                        type="button"
                        id="cancel-button"
                        class="cancel-button"
                        hidden
                    >
                        Cancel
                    </button>

                </div>

            </form>

            <p id="message" role="status" aria-live="polite"></p>

        </section>

        <!-- Student Records Table -->
        <section class="table-section">

            <h2>Student Records</h2>

            <!-- Search and Filter -->
            <div class="filter-bar">

                <input
                    type="search"
                    id="search-input"
                    placeholder="Search by name or email"
                    aria-label="Search students"
                >

                <select id="department-filter" aria-label="Filter by department">
                    <option value="">All Departments</option>
                </select>

            </div>

            <p id="result-count"></p>

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th aria-sort="descending">
                                <button type="button" class="sort-button" data-sort="id">
                                    ID <span class="sort-arrow" aria-hidden="true"></span>
                                </button>
                            </th>
                            <th>
                                <button type="button" class="sort-button" data-sort="name">
                                    Name <span class="sort-arrow" aria-hidden="true"></span>
                                </button>
                            </th>
                            <th>
                                <button type="button" class="sort-button" data-sort="email">
                                    Email <span class="sort-arrow" aria-hidden="true"></span>
                                </button>
                            </th>
                            <th>
                                <button type="button" class="sort-button" data-sort="department">
                                    Department <span class="sort-arrow" aria-hidden="true"></span>
                                </button>
                            </th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="student-table-body">
                        <tr>
                            <td colspan="5">Loading students...</td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

    </div>

    <script src="/script.js"></script>

</body>

</html>
